# Smithery configuration — https://smithery.ai/docs/config#smitheryyaml
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      casemgrApiToken:
        type: string
        description: "API token from casemgr.systems/tokens. Required for stdio clients (Claude Desktop, Cursor). Not needed for Claude Code, which authenticates via OAuth automatically."
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "casemgr-mcp"],
      env: config.casemgrApiToken ? { CASEMGR_API_TOKEN: config.casemgrApiToken } : {}
    })